<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Chats</title>
    <meta name="user-email" content="{{USER_EMAIL}}" />
    <link rel="stylesheet" href="/css/navMenu.css" />
    <link rel="stylesheet" href="/css/chat.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="nav-menu">
      <a href="/chat">
        <i
          class="fa-solid fa-comment scaleIncrease"
          id="chatUser"
          style="font-size: 1.5em"
        ></i>
      </a>
      <a href="/profile">
        <i
          class="fa-solid fa-id-badge scaleIncrease"
          id="profileUser"
          style="font-size: 1.5em"
        ></i>
      </a>
    </div>
    <div class="chat-card">
      <div class="popup-backdrop" aria-hidden="true"></div>
      <div
        class="popUpNewChat"
        role="dialog"
        aria-modal="true"
        aria-label="Create a new group chat"
        tabindex="-1"
      >
        <div class="popup-header">
          <h3>Create a New Group Chat</h3>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            class="popup-close"
          >
            <path
              fill="#a259c6"
              d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"
            />
          </svg>
        </div>

        <div class="users-list-container">
          <h4>Select participants:</h4>
          <div class="users-list" aria-label="Available users">
            <div class="user-item">
              <input type="checkbox" id="user1" class="user-checkbox" />
              <label for="user1">
                <span class="user-avatar"><i class="fas fa-user"></i></span>
                <span class="user-info">
                  <span class="user-name">Mario Rossi</span>
                  <span class="user-email">mario.rossi@example.com</span>
                </span>
              </label>
              <span class="user-add-icon" aria-hidden="true">
                <i class="fas fa-plus-circle"></i>
              </span>
            </div>

            <div class="user-item">
              <input type="checkbox" id="user2" class="user-checkbox" />
              <label for="user2">
                <span class="user-avatar"><i class="fas fa-user"></i></span>
                <span class="user-info">
                  <span class="user-name">Luigi Verdi</span>
                  <span class="user-email">luigi.verdi@example.com</span>
                </span>
              </label>
              <span class="user-add-icon" aria-hidden="true">
                <i class="fas fa-plus-circle"></i>
              </span>
            </div>

            <div class="user-item">
              <input type="checkbox" id="user3" class="user-checkbox" />
              <label for="user3">
                <span class="user-avatar"><i class="fas fa-user"></i></span>
                <span class="user-info">
                  <span class="user-name">Giulia Bianchi</span>
                  <span class="user-email">giulia.bianchi@example.com</span>
                </span>
              </label>
              <span class="user-add-icon" aria-hidden="true">
                <i class="fas fa-plus-circle"></i>
              </span>
            </div>

            <div class="user-item">
              <input type="checkbox" id="user4" class="user-checkbox" />
              <label for="user4">
                <span class="user-avatar"><i class="fas fa-user"></i></span>
                <span class="user-info">
                  <span class="user-name">Anna Neri</span>
                  <span class="user-email">anna.neri@example.com</span>
                </span>
              </label>
              <span class="user-add-icon" aria-hidden="true">
                <i class="fas fa-plus-circle"></i>
              </span>
            </div>

            <div class="user-item">
              <input type="checkbox" id="user5" class="user-checkbox" />
              <label for="user5">
                <span class="user-avatar"><i class="fas fa-user"></i></span>
                <span class="user-info">
                  <span class="user-name">Paolo Gialli</span>
                  <span class="user-email">paolo.gialli@example.com</span>
                </span>
              </label>
              <span class="user-add-icon" aria-hidden="true">
                <i class="fas fa-plus-circle"></i>
              </span>
            </div>
          </div>
        </div>

        <form id="create-chat-form" class="create-chat-form">
          <input
            name="nameNewChat"
            type="text"
            id="create-chat-input"
            placeholder="Group chat name..."
            aria-label="Group chat name"
            required
          />
          <button type="submit" class="create-btn impossible-create-btn">
            <i class="fas fa-plus"></i> Create chat
          </button>
        </form>
      </div>

      <div
        class="popUpSettings"
        role="dialog"
        aria-modal="true"
        aria-label="Group settings"
        tabindex="-1"
      >
        <div class="popup-header">
          <h3>Group settings</h3>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
            class="popup-close"
          >
            <path
              fill="#a259c6"
              d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"
            />
          </svg>
        </div>

        <div class="users-list-container">
          <h4>Select participants:</h4>
          <div class="users-list">
            <!-- Lista utenti statica (da popolare dinamicamente in produzione) -->
          </div>
        </div>
        <button type="submit" class="addUsers-btn impossible-create-btn">
          <i class="fas fa-plus"></i> Add people
        </button>

        <button type="submit" class="addUsers-btn" id="exitGroup">
          <i class="fa-solid fa-person-walking-dashed-line-arrow-right"></i>
          Leave group
        </button>
      </div>

      <div class="chat-content">
        <div class="chat-sidebar">
          <div id="search-chat-form" class="search-chat-form">
            <input
              type="text"
              id="search-chat-input"
              placeholder="Search chats..."
              aria-label="Search chats"
            />
          </div>
          <svg
            class="hideSettings scaleIncrease"
            id="groupSettings"
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            viewBox="0 0 24 24"
          >
            <path
              fill="currentColor"
              fill-rule="evenodd"
              d="M14.208 4.83q.68.21 1.3.54l1.833-1.1a1 1 0 0 1 1.221.15l1.018 1.018a1 1 0 0 1 .15 1.221l-1.1 1.833q.33.62.54 1.3l2.073.519a1 1 0 0 1 .757.97v1.438a1 1 0 0 1-.757.97l-2.073.519q-.21.68-.54 1.3l1.1 1.833a1 1 0 0 1-.15 1.221l-1.018 1.018a1 1 0 0 1-1.221.15l-1.833-1.1q-.62.33-1.3.54l-.519 2.073a1 1 0 0 1-.97.757h-1.438a1 1 0 0 1-.97-.757l-.519-2.073a7.5 7.5 0 0 1-1.3-.54l-1.833 1.1a1 1 0 0 1-1.221-.15L4.42 18.562a1 1 0 0 1-.15-1.221l1.1-1.833a7.5 7.5 0 0 1-.54-1.3l-2.073-.519A1 1 0 0 1 2 12.72v-1.438a1 1 0 0 1 .757-.97l2.073-.519q.21-.68.54-1.3L4.27 6.66a1 1 0 0 1 .15-1.221L5.438 4.42a1 1 0 0 1 1.221-.15l1.833 1.1q.62-.33 1.3-.54l.519-2.073A1 1 0 0 1 11.28 2h1.438a1 1 0 0 1 .97.757zM12 16a4 4 0 1 0 0-8a4 4 0 0 0 0 8"
            />
          </svg>
          <svg
            class="scaleIncrease bi bi-plus-circle-fill"
            id="plusButton"
            xmlns="http://www.w3.org/2000/svg"
            width="30"
            height="30"
            fill="var(--primary-color)"
            viewBox="0 0 16 16"
          >
            <path
              d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z"
            />
          </svg>
        </div>
        <div class="chat-main">
          <div class="chat-list-column">
            <h2 class="chat-list-heading">My Chats</h2>
            <ul id="chats" class="chat-list"></ul>
          </div>
          <div class="message-column">
            <div class="main-header"></div>
            <ul id="messages" class="message-list"></ul>
            <form id="message-form" class="message-form hide-form-sender">
              <input
                type="text"
                id="message-input"
                placeholder="Write a message..."
                aria-label="Write a message"
                required
              />
              <button type="submit" class="send-btn">
                <i class="fas fa-paper-plane"></i> Send
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
